<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--fg:#f1eee8;--card:#24221f;--accent:#fb923c;--ok:#4ade80;--bad:#f87171;--mute:#3a3733}}
:root[data-theme="dark"]{--bg:#171614;--fg:#f1eee8;--card:#24221f;--accent:#fb923c;--ok:#4ade80;--bad:#f87171;--mute:#3a3733}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 16px;text-align:center}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{opacity:.7;font-size:.9rem;margin-bottom:12px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
svg{width:160px;height:160px;stroke:var(--fg);stroke-width:4;fill:none;stroke-linecap:round}
#word{font-size:2rem;letter-spacing:.35em;font-family:ui-monospace,Menlo,monospace;margin:6px 0;min-height:2.4rem}
#hint{opacity:.8;margin-bottom:6px}
#status{min-height:1.5rem;font-weight:bold}
#kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#kb button{width:38px;height:42px;font-size:1rem;border:0;border-radius:8px;background:var(--mute);color:var(--fg);cursor:pointer;font-family:inherit}
#kb button.ok{background:var(--ok);color:#fff}
#kb button.bad{background:var(--bad);color:#fff}
#kb button:disabled{cursor:default}
#again{margin-top:12px;padding:10px 22px;font-size:1rem;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
.ctl{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.ctl select{padding:8px 10px;border-radius:8px;border:1px solid var(--mute);background:var(--card);color:var(--fg);font-family:inherit;font-size:.95rem}
.acts{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.acts button{padding:8px 14px;border:0;border-radius:10px;background:var(--mute);color:var(--fg);font-family:inherit;font-size:.9rem;cursor:pointer}
.acts button:disabled{opacity:.5;cursor:default}
#info{font-size:.95rem;margin-top:6px}
#stats{font-size:.8rem;opacity:.7;margin-top:8px}
#clock{font-weight:bold;min-height:1.4rem}
#review{margin-top:14px;font-size:.9rem}
#review button{margin:4px;padding:8px 14px;border:0;border-radius:10px;background:var(--mute);color:var(--fg);font-family:inherit;cursor:pointer}
.rvh{font-weight:bold}
.rvl{opacity:.8;margin:4px 0 8px}
:root{--bg2:#ebe4d3;--shadow:0 6px 24px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg2:#0f0e0d;--shadow:0 6px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg2:#0f0e0d;--shadow:0 6px 24px rgba(0,0,0,.5)}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100vh}
h1{font-size:1.5rem;letter-spacing:.02em;margin-bottom:6px}
.card{border-radius:20px;box-shadow:var(--shadow);padding:16px}
svg{width:170px;height:170px}
#word{letter-spacing:0;font-size:1rem}
.tile{display:inline-block;width:1.5rem;height:2.4rem;line-height:2.4rem;margin:0 3px;border-bottom:3px solid var(--fg);font-size:1.7rem;font-family:ui-monospace,Menlo,monospace}
#kb{flex-direction:column;flex-wrap:nowrap;align-items:center;gap:6px}
.krow{display:flex;gap:6px;justify-content:center;width:100%}
#kb button{width:auto;flex:1 1 0;min-width:0;max-width:42px;height:46px;border-radius:10px;font-weight:600;font-size:1.05rem;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s,background .15s}
#kb button:active:not(:disabled){transform:translateY(2px)}
@media (hover:hover){#kb button:hover:not(:disabled){background:var(--accent);color:#fff}}
.typebox{display:flex;gap:8px;margin:0 0 12px}
.typebox input{flex:1;min-width:0;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--mute);background:var(--card);color:var(--fg);font-family:inherit}
.typebox button{padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer;font-family:inherit}
#again{box-shadow:var(--shadow)}
</style>

var SEEN={};WORDS.forEach(function(w){SEEN[w[0]]=1});
Object.keys(BULK).forEach(function(t){BULK[t].split(";").forEach(function(p){var a=p.split("=");var w=a[0].trim();if(!w||!a[1]||SEEN[w])return;SEEN[w]=1;WORDS.push([w,a[1],"A word with "+w.length+" letters, starts with "+w[0].toUpperCase()]);EXTRA[w]=t})});
function topicOf(w){return EXTRA[w[0]]||(MUSIC[w[0]]?"music":"film")}
function topicOk(w){var t=document.getElementById("topic").value;return t==="all"||topicOf(w)===t}
function pool(){var r=pool0();return r.length?r:WORDS.filter(topicOk)}
function pool0(){if(practice){var m=WORDS.filter(function(w){return missed.indexOf(w[0])>=0});if(m.length)return m;practice=false}var lv=document.getElementById("level").value;return WORDS.filter(topicOk).filter(function(w){var n=w[0].length;return lv==="all"||(lv==="easy"&&n<=6)||(lv==="mid"&&n>=7&&n<=8)||(lv==="hard"&&n>=9)})}
var word,hint,guessed,wrong,over,last=-1,cur,stats={w:0,l:0,s:0,b:0};
var timerId=null,tleft=0,practice=false,missed=[],resetArmed=false;
try{missed=JSON.parse(localStorage.getItem("hm-missed")||"[]")}catch(err){missed=[]}
function rowFor(c){var rows=["qwertyuiop","asdfghjkl","zxcvbnm"];var i=rows[0].indexOf(c)>=0?0:rows[1].indexOf(c)>=0?1:2;
 while(kb.children.length<=i){var d=document.createElement("div");d.className="krow";kb.appendChild(d)}
 return kb.children[i]}
function submitTyped(){var inp=document.getElementById("typed");var v=inp.value.trim().toLowerCase();inp.value="";
 if(over){start();return}
 if(!/^[a-z]+$/.test(v))return;
 if(v.length===1){guess(v);return}
 if(v===word){word.split("").forEach(function(c){if(!guessed[c]){guessed[c]=true;var k=document.getElementById("k"+c);k.disabled=true;k.className="ok"}});render();finish(true)}
 else{wrong++;render();statusEl.textContent="Нет, это не «"+v+"» (−попытка)";statusEl.style.color="var(--bad)";if(wrong>=6)finish(false)}
}
function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function drawClock(){var c=document.getElementById("clock");c.textContent=timerId?"⏱ "+tleft+" с":"";c.style.color=tleft<=10?"var(--bad)":""}
function startTimer(){clearTimer();var t=document.getElementById("timer").value;if(t==="off"){drawClock();return}
 tleft=parseInt(t,10);
 timerId=setInterval(function(){tleft--;if(tleft<=0&&!over){finish(false);statusEl.textContent="Время вышло! "+statusEl.textContent}else drawClock()},1000);drawClock()}
function updateMissed(won){var i=missed.indexOf(cur[0]);if(won){if(i>=0)missed.splice(i,1)}else if(i<0)missed.push(cur[0]);try{localStorage.setItem("hm-missed",JSON.stringify(missed))}catch(err){}}
function renderReview(){var r=document.getElementById("review");r.textContent="";
 var list=WORDS.filter(function(w){return missed.indexOf(w[0])>=0});
 if(list.length){
  var h=document.createElement("div");h.className="rvh";h.textContent="Слова для повторения ("+list.length+")";r.appendChild(h);
  var p=document.createElement("div");p.className="rvl";p.textContent=list.map(function(w){return w[0]+" — "+w[1]}).join(" · ");r.appendChild(p);
  var b=document.createElement("button");b.textContent="Тренировать ошибки";b.onclick=function(){practice=true;start()};r.appendChild(b);
 }
 var x=document.createElement("button");x.textContent=resetArmed?"Точно сбросить?":"Сбросить статистику";
 x.onclick=function(){if(!resetArmed){resetArmed=true;renderReview();return}
  resetArmed=false;stats={w:0,l:0,s:0,b:0};missed=[];saveStats();try{localStorage.setItem("hm-missed","[]")}catch(err){}showStats();renderReview()};
 r.appendChild(x);
}
try{var sv=localStorage.getItem("hm-stats");if(sv)stats=JSON.parse(sv)}catch(err){}
function saveStats(){try{localStorage.setItem("hm-stats",JSON.stringify(stats))}catch(err){}}
function showStats(){document.getElementById("stats").textContent="Победы: "+stats.w+" · Поражения: "+stats.l+" · Серия: "+stats.s+" (рекорд "+stats.b+")"}
function finish(won){
 over=true;again.hidden=false;document.getElementById("hintbtn").disabled=true;document.getElementById("speak").hidden=false;
 if(won){stats.w++;stats.s++;if(stats.s>stats.b)stats.b=stats.s;statusEl.textContent="Победа! 🎉";statusEl.style.color="var(--ok)"}
 else{stats.l++;stats.s=0;statusEl.textContent="Слово: "+word.toUpperCase();statusEl.style.color="var(--bad)";word.split("").forEach(function(c){guessed[c]=true});render()}
 var inf=document.getElementById("info");inf.textContent="";
 var b=document.createElement("b");b.textContent=cur[0]+" — "+cur[1];inf.appendChild(b);inf.appendChild(document.createElement("br"));inf.appendChild(document.createTextNode(cur[2]));
 clearTimer();drawClock();updateMissed(won);saveStats();showStats();renderReview();
}
var kb=document.getElementById("kb"),wordEl=document.getElementById("word"),statusEl=document.getElementById("status"),again=document.getElementById("again");
function start(){
 var P=pool(),i;do{i=Math.floor(Math.random()*P.length)}while(P.length>1&&P[i][0]===last);last=P[i][0];
 var e=P[i];cur=e;word=e[0];hint=document.getElementById("hintmode").value==="en"?"Hint: "+e[2]:"Подсказка: "+e[1];guessed={};wrong=0;over=false;
 document.getElementById("hint").textContent=hint;
 kb.innerHTML="";
 "qwertyuiopasdfghjklzxcvbnm".split("").forEach(function(c){
  var b=document.createElement("button");b.textContent=c.toUpperCase();b.id="k"+c;
  b.onclick=function(){guess(c)};rowFor(c).appendChild(b);
 });
 again.hidden=true;document.getElementById("speak").hidden=true;document.getElementById("info").textContent="";statusEl.textContent="";statusEl.style.color="";showStats();resetArmed=false;document.getElementById("review").textContent="";startTimer();
 render();
}
function render(){document.getElementById("hintbtn").disabled=over||wrong>=5;
 wordEl.textContent="";word.split("").forEach(function(c){var s=document.createElement("span");s.className="tile";s.textContent=guessed[c]?c.toUpperCase():"";wordEl.appendChild(s)});
 for(var n=1;n<=6;n++)document.getElementById("p"+n).style.display=n<=wrong?"":"none";
}
function guess(c){
 if(over||guessed[c])return;statusEl.textContent="";
 guessed[c]=true;
 var b=document.getElementById("k"+c);b.disabled=true;
 if(word.indexOf(c)>=0){b.className="ok"}else{b.className="bad";wrong++}
 render();
 var won=word.split("").every(function(x){return guessed[x]});
 if(won){finish(true)}
 else if(wrong>=6){finish(false)}
}
document.addEventListener("keydown",function(e){
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target&&e.target.tagName==="INPUT")return;
 var c=e.key.toLowerCase();
 if(/^[a-z]$/.test(c))guess(c);
 else if(e.key==="Enter"&&over)start();
});
again.onclick=start;
document.getElementById("hintbtn").onclick=function(){
 if(over||wrong>=5)return;
 var left=word.split("").filter(function(c){return !guessed[c]});
 if(!left.length)return;
 var c=left[Math.floor(Math.random()*left.length)];
 guessed[c]=true;wrong++;
 var kb2=document.getElementById("k"+c);kb2.disabled=true;kb2.className="ok";
 render();
 if(word.split("").every(function(x){return guessed[x]}))finish(true);
};
document.getElementById("go").onclick=submitTyped;
document.getElementById("typed").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();submitTyped()}};
document.getElementById("speak").onclick=function(){try{var u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(err){}};
["level","hintmode","topic","timer"].forEach(function(id){var s=document.getElementById(id);s.onchange=function(){s.blur();practice=false;start()}});
start();
</script>
